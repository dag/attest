[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest"
version = "0.7"
description = "Modern, Pythonic unit testing."
readme = "README.rst"
license = "BSD-3-Clause"
authors = [
    { name = "Dag Odenhall", email = "dag.odenhall@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "progressbar2>=3.0",
    "pygments",
]

[project.urls]
Homepage = "https://github.com/dag/attest"
Repository = "https://github.com/dag/attest"

[project.scripts]
attest = "attest.run:main"

[project.entry-points."attest.reporters"]
xml = "attest:XmlReporter"
xunit = "attest:XUnitReporter"
quickfix = "attest:QuickFixReporter"
plain = "attest:PlainReporter"
fancy = "attest:FancyReporter"
auto = "attest:auto_reporter"

[project.entry-points."pygments.styles"]
attest = "attest.pygments:Attest"

[tool.hatch.build.targets.wheel]
packages = ["attest"]

[tool.hatch.build.targets.sdist]
include = [
    "attest/",
    "docs/",
    "tests/",
    "*.rst",
    "*.py",
    "LICENSE",
    "MANIFEST.in",
]

# Development dependencies (optional)
[project.optional-dependencies]
dev = [
    "ruff",
    "sphinx",
    "tox",
]
docs = [
    "sphinx",
]
test = [
    "tox",
]

# Tox configuration
[tool.tox]
env_list = ["py311", "py312", "py313", "pypy3", "doctest"]

[tool.tox.env_run_base]
commands = [["attest", "attest.tests"]]

[tool.tox.env.doctest]
deps = ["sphinx"]
change_dir = "docs"
commands = [["sphinx-build", "-WEab", "{envname}", "-d", "{envtmpdir}/doctrees", ".", "{envtmpdir}/{envname}"]]

[tool.tox.env.html]
deps = ["sphinx"]
change_dir = "docs"
commands = [["sphinx-build", "-WEab", "{envname}", "-d", "{envtmpdir}/doctrees", ".", "{envtmpdir}/{envname}"]]

[tool.tox.env.linkcheck]
deps = ["sphinx"]
change_dir = "docs"
commands = [["sphinx-build", "-WEab", "{envname}", "-d", "{envtmpdir}/doctrees", ".", "{envtmpdir}/{envname}"]]

[tool.tox.env.spelling]
deps = [
    "sphinx",
    "sphinxcontrib-spelling>=1.0",
    "pyenchant",
]
change_dir = "docs"
commands = [["sphinx-build", "-Eab", "{envname}", "-d", "{envtmpdir}/doctrees", ".", "{envtmpdir}/{envname}"]]

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405", "I001"]  # Allow star imports and unused imports
"attest/ast.py" = ["F403", "F405"]  # Star imports from _ast module are intentional
"attest/utils.py" = ["B020"]  # loop control variable overrides intentional in module iteration
"attest/collectors.py" = ["B020"]  # ditto
